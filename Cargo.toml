[workspace]
resolver = "2"
members = [
    "coral",
    "coral-types",
    "coral-command",
    "coral-config",
    "coral-protocol",
    "coral-server",
    "coral-world",
]

[workspace.dependencies]
aes = "0.9.3"
base64 = "0.23.1"
bytes = "1.12.1"
cfb8 = "0.9.1"
cipher = "0.5.2"
flate2 = "1.1.10"
futures = "0.3.34"
num-bigint = "0.5.1"
rand = "0.10.3"
reqwest = { version = "0.13.5", features = ["json"] }
rsa = "=0.10.0-rc.19"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
tar = "0.4.46"
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }
tokio = { version = "1.54.1", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["codec"] }
toml = "1.1.8+spec-1.1.0"
toml_edit = "0.25.17+spec-1.1.0"
uuid = { version = "1.29.0", features = ["v3", "v4"] }
sysinfo = "0.40.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
